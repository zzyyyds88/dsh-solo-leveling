# dsh-live-stats bundle patch: inserts its plugin row into the web profile
# roster. This package has no dsh.bundle (row aggregated into dsh-task-suite-all) —do NOT install standalone via
# `dsh plugin --profile <name> add <path-or-git-url>`.
#
# The single row mounts BOTH halves: the host side (token estimation +
# generation throughput) and the browser side (the TPS row under the
# composer stats, via the dsh.client declaration in package.json).
- insert:
    - id: live-stats
      name: '@zzyyyds88/dsh-live-stats'
