# miku skin bundle patch: inserts its dsh.client row into the web plugin roster.
# This package has no dsh.bundle (row aggregated into dsh-task-suite-all) —do NOT install standalone via
# `dsh plugin --profile <name> add <path-or-git-url>`; mutual exclusion between
# skins is managed by scripts/dsh-skin (home-layer disabled rows).
- insert:
    - id: ui-skin-miku
      name: '@zzyyyds88/dsh-client-ui-skin-miku'

