# blue-fantasy skin bundle patch: inserts its dshClient row into the web plugin roster.
# This row is aggregated into the dsh-task-suite-all patch (the skin package
# itself has no dsh.bundle, so `dsh plugin add` alone won't apply it).
# Mutual exclusion between skins is managed by the home-layer managed section.
- insert:
    - id: ui-skin-blue-fantasy
      name: '@zzyyyds88/dsh-client-ui-skin-blue-fantasy'
