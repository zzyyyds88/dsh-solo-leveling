# skin-center bundle patch: inserts its dshClient row into the web plugin roster.
# This package has no dsh.bundle (row aggregated into dsh-task-suite-all) —do NOT install standalone via
# `dsh plugin --profile <name> add <path-or-git-url>`.
- insert:
    - id: ui-skin-center
      name: '@zzyyyds88/dsh-client-ui-skin-center'
